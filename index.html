<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio David AI - Generador de Voz</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .audio-invert { filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Componente de Icono simplificado para CDN
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [text, setText] = useState('Hello, I am David. I am ready to speak in English or Spanish with elegance and speed.');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [selectedVoice, setSelectedVoice] = useState('Fenrir');
            const [language, setLanguage] = useState('en');
            const [speakingRate, setSpeakingRate] = useState('fast');
            const [tone, setTone] = useState('elegante');
            const [error, setError] = useState(null);

            const apiKey = ""; // La clave se inserta automáticamente en el entorno
            const MAX_CHARS = 5000;

            const voices = [
                { id: 'Fenrir', name: 'David', desc: 'Grave y Ejecutivo' },
                { id: 'Charon', name: 'Charon', desc: 'Profundo' },
                { id: 'Kore', name: 'Kore', desc: 'Ejecutiva' },
                { id: 'Puck', name: 'Puck', desc: 'Jovial' }
            ];

            const callGemini = async (prompt) => {
                setIsAiProcessing(true);
                setError(null);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (resultText) setText(resultText.trim());
                } catch (err) {
                    setError("Error con Gemini IA");
                } finally {
                    setIsAiProcessing(false);
                }
            };

            const pcmToWav = (pcmData, sampleRate) => {
                const buffer = new ArrayBuffer(44 + pcmData.length * 2);
                const view = new DataView(buffer);
                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
                };
                writeString(0, 'RIFF');
                view.setUint32(4, 32 + pcmData.length * 2, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeString(36, 'data');
                view.setUint32(40, pcmData.length * 2, true);
                let offset = 44;
                for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
                return new Blob([buffer], { type: 'audio/wav' });
            };

            const generateSpeech = async () => {
                if (!text.trim()) return;
                setIsGenerating(true);
                setError(null);

                const rateDesc = {
                    'slow': 'slowly and calmly',
                    'normal': 'at a normal pace',
                    'fast': 'at a fast, fluent, and energetic pace without pauses'
                };

                const prompt = `Act as ${selectedVoice === 'Fenrir' ? 'David, elegant deep voice' : selectedVoice}. Language: ${language === 'es' ? 'Spanish' : 'English'}. Tone: ${tone}. Speed: ${rateDesc[speakingRate]}. Text: ${text}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } }
                            }
                        })
                    });
                    const result = await response.json();
                    const audioPart = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                    if (audioPart) {
                        const binaryString = atob(audioPart.inlineData.data);
                        const pcmData = new Int16Array(binaryString.length / 2);
                        for (let i = 0; i < pcmData.length; i++) {
                            pcmData[i] = binaryString.charCodeAt(i * 2) | (binaryString.charCodeAt(i * 2 + 1) << 8);
                        }
                        const sampleRate = parseInt(audioPart.inlineData.mimeType.match(/sample_rate=(\d+)/)?.[1] || "24000");
                        setAudioUrl(URL.createObjectURL(pcmToWav(pcmData, sampleRate)));
                    }
                } catch (err) {
                    setError("Error al generar audio");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen p-2 md:p-8">
                    <div className="max-w-6xl mx-auto bg-white rounded-[2rem] shadow-2xl border border-slate-200 overflow-hidden">
                        <header className="bg-gradient-to-r from-blue-900 to-indigo-800 p-6 md:p-8 text-white">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div className="flex items-center gap-3">
                                    <Icon name="sparkles" className="w-8 h-8 text-blue-300" />
                                    <h1 className="text-2xl md:text-3xl font-black tracking-tight">Estudio David AI</h1>
                                </div>
                                <div className="bg-blue-700/50 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest self-start">
                                    Mobile Optimized
                                </div>
                            </div>
                        </header>

                        <div className="p-4 md:p-8 grid grid-cols-1 lg:grid-cols-4 gap-6 md:gap-8">
                            {/* Panel Lateral */}
                            <div className="space-y-6">
                                <section>
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">Locutor</label>
                                    <div className="space-y-2">
                                        {voices.map(v => (
                                            <button key={v.id} onClick={() => setSelectedVoice(v.id)} 
                                                className={`w-full text-left p-3 rounded-xl border-2 transition-all ${selectedVoice === v.id ? 'border-blue-600 bg-blue-50' : 'border-slate-100 bg-white'}`}>
                                                <div className="font-bold text-slate-800 text-sm">{v.name}</div>
                                                <div className="text-[9px] text-slate-400 font-bold uppercase">{v.desc}</div>
                                            </button>
                                        ))}
                                    </div>
                                </section>

                                <section className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-4">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Idioma</label>
                                        <div className="flex p-1 bg-slate-200 rounded-lg">
                                            <button onClick={() => setLanguage('es')} className={`flex-1 py-1 text-[10px] font-bold rounded ${language === 'es' ? 'bg-white shadow' : 'text-slate-500'}`}>ES</button>
                                            <button onClick={() => setLanguage('en')} className={`flex-1 py-1 text-[10px] font-bold rounded ${language === 'en' ? 'bg-white shadow' : 'text-slate-500'}`}>EN</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Velocidad</label>
                                        <select value={speakingRate} onChange={(e) => setSpeakingRate(e.target.value)} className="w-full bg-white p-2 rounded-lg border border-slate-200 text-xs font-bold outline-none">
                                            <option value="slow">Pausado</option>
                                            <option value="normal">Normal</option>
                                            <option value="fast">Fluido / Ágil</option>
                                        </select>
                                    </div>
                                </section>
                            </div>

                            {/* Área Principal */}
                            <div className="lg:col-span-3 space-y-4">
                                <div className="flex flex-wrap gap-2 mb-2">
                                    <button onClick={() => callGemini(`Mejora este texto para locución profesional: ${text}`)} className="px-3 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full text-[10px] font-bold">✨ Pulir</button>
                                    <button onClick={() => callGemini(`Traduce este texto al ${language === 'es' ? 'inglés' : 'español'}: ${text}`)} className="px-3 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-full text-[10px] font-bold">✨ Traducir</button>
                                    <button onClick={() => callGemini(`Resume este texto: ${text}`)} className="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-[10px] font-bold">✨ Resumir</button>
                                </div>

                                <div className="relative">
                                    <textarea value={text} onChange={(e) => setText(e.target.value)} 
                                        className={`w-full h-64 md:h-80 p-5 rounded-3xl border-2 border-slate-100 focus:border-blue-600 focus:outline-none text-base md:text-lg leading-relaxed bg-slate-50 transition-all ${isAiProcessing ? 'opacity-50' : ''}`}
                                        placeholder="Escribe el guion aquí..."
                                    />
                                    {isAiProcessing && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-white/50 backdrop-blur-sm rounded-3xl">
                                            <Icon name="loader-2" className="w-8 h-8 animate-spin text-blue-600" />
                                        </div>
                                    )}
                                </div>

                                <button onClick={generateSpeech} disabled={isGenerating || isAiProcessing}
                                    className={`w-full py-5 rounded-2xl font-black text-white uppercase tracking-widest text-sm shadow-xl transition-all ${isGenerating ? 'bg-slate-400' : 'bg-blue-600 hover:bg-blue-700 active:scale-[0.98]'}`}>
                                    {isGenerating ? <Icon name="loader-2" className="animate-spin mx-auto w-6 h-6" /> : "Generar Locución David"}
                                </button>

                                {audioUrl && (
                                    <div className="p-6 bg-slate-900 text-white rounded-3xl flex flex-col items-center gap-4 animate-in fade-in slide-in-from-bottom-4 shadow-2xl">
                                        <div className="flex justify-between w-full border-b border-slate-700 pb-2">
                                            <span className="text-[9px] font-black uppercase tracking-widest text-blue-400">Audio Listo</span>
                                            <a href={audioUrl} download="audio_ia.wav" className="text-[9px] font-bold hover:text-blue-400 transition-colors">DESCARGAR</a>
                                        </div>
                                        <audio controls src={audioUrl} className="w-full audio-invert" autoPlay />
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
