<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>David AI Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y dependencias -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .audio-player::-webkit-media-controls-panel { background-color: #f1f5f9; }
        /* Animación de carga */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root">
        <!-- Loader inicial para evitar pantalla blanca -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="spinner border-blue-600 border-t-blue-600 mb-4 mx-auto"></div>
                <p class="text-slate-500 font-bold animate-pulse">CARGANDO ESTUDIO...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [text, setText] = useState('Hello, I am David. I am now optimized for Safari and mobile devices. Let us create something amazing.');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [selectedVoice, setSelectedVoice] = useState('Fenrir');
            const [language, setLanguage] = useState('en');
            const [speed, setSpeed] = useState('fast');
            const [error, setError] = useState(null);

            // Reemplaza "" por tu clave de API de Gemini
            const  AIzaSyBj9h_CH6RrcCXaejIHpihKaRj0qRoO0nk = ""; 

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [audioUrl, isGenerating, isAiProcessing]);

            const callGeminiLLM = async (instruction) => {
                if (!CONST_API_KEY) {
                    setError("Falta la API Key en el código.");
                    return;
                }
                setIsAiProcessing(true);
                setError(null);
                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${CONST_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `${instruction}: "${text}"` }] }] })
                    });
                    const data = await resp.json();
                    const newText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (newText) setText(newText.trim());
                } catch (e) {
                    setError("Error de conexión con Gemini.");
                } finally {
                    setIsAiProcessing(false);
                }
            };

            const generateAudio = async () => {
                if (!CONST_API_KEY) {
                    setError("Configura tu API Key primero.");
                    return;
                }
                setIsGenerating(true);
                setError(null);

                const speedMap = { slow: 'slowly', normal: 'normal pace', fast: 'fast and fluent without pauses' };
                const prompt = `Voice: ${selectedVoice}. Lang: ${language === 'es' ? 'Spanish' : 'English'}. Speed: ${speedMap[speed]}. Text: ${text}`;

                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${CONST_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } }
                            }
                        })
                    });
                    
                    const result = await resp.json();
                    const audioData = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                    
                    if (audioData) {
                        const raw = atob(audioData.data);
                        const pcm = new Int16Array(raw.length / 2);
                        for (let i = 0; i < pcm.length; i++) {
                            pcm[i] = raw.charCodeAt(i * 2) | (raw.charCodeAt(i * 2 + 1) << 8);
                        }
                        
                        // Generar WAV
                        const sampleRate = 24000;
                        const buffer = new ArrayBuffer(44 + pcm.length * 2);
                        const view = new DataView(buffer);
                        const writeStr = (off, s) => { for (let i=0; i<s.length; i++) view.setUint8(off+i, s.charCodeAt(i)); };
                        writeStr(0, 'RIFF');
                        view.setUint32(4, 32 + pcm.length * 2, true);
                        writeStr(8, 'WAVE');
                        writeStr(12, 'fmt ');
                        view.setUint32(16, 16, true);
                        view.setUint16(20, 1, true);
                        view.setUint16(22, 1, true);
                        view.setUint32(24, sampleRate, true);
                        view.setUint32(28, sampleRate * 2, true);
                        view.setUint16(32, 2, true);
                        view.setUint16(34, 16, true);
                        writeStr(36, 'data');
                        view.setUint32(40, pcm.length * 2, true);
                        for (let i=0; i<pcm.length; i++) view.setInt16(44 + i*2, pcm[i], true);
                        
                        const blob = new Blob([buffer], { type: 'audio/wav' });
                        setAudioUrl(URL.createObjectURL(blob));
                    }
                } catch (e) {
                    setError("Fallo al generar el audio.");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-4xl mx-auto md:py-10 px-4">
                    <div className="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200">
                        {/* Header */}
                        <div className="bg-slate-900 p-8 text-white flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-extrabold tracking-tighter flex items-center gap-2">
                                    <i data-lucide="mic" className="text-blue-500"></i> DAVID <span className="text-blue-500">PRO</span>
                                </h1>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Mobile Studio</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setLanguage('es')} className={`px-3 py-1 rounded-full text-[10px] font-black border ${language === 'es' ? 'bg-blue-600 border-blue-600' : 'border-slate-700'}`}>ES</button>
                                <button onClick={() => setLanguage('en')} className={`px-3 py-1 rounded-full text-[10px] font-black border ${language === 'en' ? 'bg-blue-600 border-blue-600' : 'border-slate-700'}`}>EN</button>
                            </div>
                        </div>

                        <div className="p-6 md:p-10 space-y-8">
                            {/* Herramientas IA */}
                            <div className="flex flex-wrap gap-2">
                                <button disabled={isAiProcessing} onClick={() => callGeminiLLM("Mejora este texto para que sea elegante")} className="flex-1 py-3 bg-blue-50 text-blue-700 rounded-2xl text-[10px] font-black uppercase border border-blue-100 active:scale-95 transition-all">✨ Pulir</button>
                                <button disabled={isAiProcessing} onClick={() => callGeminiLLM("Traduce este texto")} className="flex-1 py-3 bg-indigo-50 text-indigo-700 rounded-2xl text-[10px] font-black uppercase border border-indigo-100 active:scale-95 transition-all">✨ Traducir</button>
                                <button disabled={isAiProcessing} onClick={() => callGeminiLLM("Resume este texto")} className="flex-1 py-3 bg-emerald-50 text-emerald-700 rounded-2xl text-[10px] font-black uppercase border border-emerald-100 active:scale-95 transition-all">✨ Resumir</button>
                            </div>

                            {/* Editor */}
                            <div className="relative group">
                                <textarea 
                                    value={text} 
                                    onChange={(e) => setText(e.target.value)}
                                    className="w-full h-64 p-6 bg-slate-50 rounded-3xl border-2 border-slate-100 focus:border-blue-500 outline-none text-slate-800 text-lg leading-relaxed transition-all"
                                />
                                {isAiProcessing && (
                                    <div className="absolute inset-0 bg-white/60 backdrop-blur-sm flex items-center justify-center rounded-3xl">
                                        <div className="spinner border-blue-600 border-t-transparent"></div>
                                    </div>
                                )}
                            </div>

                            {/* Configuración inferior */}
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Velocidad</label>
                                    <select value={speed} onChange={e => setSpeed(e.target.value)} className="w-full p-4 bg-slate-100 rounded-2xl text-sm font-bold border-none outline-none appearance-none">
                                        <option value="slow">Lento</option>
                                        <option value="normal">Normal</option>
                                        <option value="fast">Rápido (Fluido)</option>
                                    </select>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Voz</label>
                                    <select value={selectedVoice} onChange={e => setSelectedVoice(e.target.value)} className="w-full p-4 bg-slate-100 rounded-2xl text-sm font-bold border-none outline-none appearance-none">
                                        <option value="Fenrir">David (Elegante)</option>
                                        <option value="Charon">Charon (Serio)</option>
                                        <option value="Kore">Kore (Clara)</option>
                                    </select>
                                </div>
                            </div>

                            <button 
                                onClick={generateAudio} 
                                disabled={isGenerating || isAiProcessing}
                                className={`w-full py-6 rounded-[1.5rem] font-black text-white uppercase tracking-widest text-sm shadow-2xl transition-all active:scale-95 ${isGenerating ? 'bg-slate-400' : 'bg-blue-600 shadow-blue-200'}`}
                            >
                                {isGenerating ? "Generando..." : "PRODUCIR AUDIO"}
                            </button>

                            {error && <div className="p-4 bg-red-50 text-red-600 rounded-2xl text-center font-bold text-xs">{error}</div>}

                            {audioUrl && !isGenerating && (
                                <div className="p-6 bg-slate-50 rounded-3xl border border-slate-200 space-y-4 animate-in fade-in slide-in-from-bottom-4">
                                    <div className="flex justify-between items-center px-2">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Masterizado Final</span>
                                        <a href={audioUrl} download="locucion_david.wav" className="text-blue-600 font-bold text-xs hover:underline">DESCARGAR .WAV</a>
                                    </div>
                                    <audio controls src={audioUrl} className="w-full" autoPlay />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
