<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>David AI Studio</title>
    <!-- Cargando librerías desde CDNs confiables -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        /* Spinner de carga personalizado */
        .loading-spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <!-- Estado inicial de carga -->
        <div class="flex flex-col items-center justify-center min-h-screen">
            <div class="loading-spinner mb-4"></div>
            <p class="text-slate-500 font-bold animate-pulse text-sm tracking-widest">INICIANDO ESTUDIO...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [text, setText] = useState('Hola, soy David. Tu clave de API ha sido configurada correctamente. Estoy listo para narrar tus guiones en inglés o español.');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [selectedVoice, setSelectedVoice] = useState('Fenrir');
            const [language, setLanguage] = useState('es');
            const [speed, setSpeed] = useState('fast');
            const [error, setError] = useState(null);

            // API KEY insertada por seguridad
            const API_KEY = "AIzaSyBj9h_CH6RrcCXaejIHpihKaRj0qRoO0nk"; 

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [audioUrl, isGenerating, isAiProcessing]);

            const callGeminiAI = async (mode) => {
                setIsAiProcessing(true);
                setError(null);
                
                const prompts = {
                    polish: "Reescribe este texto para que suene más profesional, elegante y fluido para un narrador: ",
                    translate: `Traduce este texto al ${language === 'es' ? 'inglés' : 'español'} de forma natural: `,
                    summarize: "Resume este texto manteniendo los puntos clave: "
                };

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompts[mode] + text }] }] })
                    });
                    const data = await response.json();
                    const result = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (result) setText(result.trim());
                    if (mode === 'translate') setLanguage(language === 'es' ? 'en' : 'es');
                } catch (e) {
                    setError("Error al procesar con IA.");
                } finally {
                    setIsAiProcessing(false);
                }
            };

            const produceAudio = async () => {
                setIsGenerating(true);
                setError(null);
                
                const speedMap = { slow: 'slowly', normal: 'normal pace', fast: 'fast and energetic pace' };
                const ttsPrompt = `Speak in ${language === 'es' ? 'Spanish' : 'English'}. Voice tone: elegant. Speed: ${speedMap[speed]}. Text: ${text}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: ttsPrompt }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } }
                            }
                        })
                    });
                    
                    const result = await response.json();
                    const audioPart = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                    
                    if (audioPart) {
                        const binary = atob(audioPart.inlineData.data);
                        const len = binary.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
                        
                        // Conversión PCM a WAV simple
                        const sampleRate = 24000;
                        const wavBuffer = new ArrayBuffer(44 + len);
                        const view = new DataView(wavBuffer);
                        const writeString = (off, s) => { for(let i=0; i<s.length; i++) view.setUint8(off+i, s.charCodeAt(i)); };
                        
                        writeString(0, 'RIFF');
                        view.setUint32(4, 36 + len, true);
                        writeString(8, 'WAVE');
                        writeString(12, 'fmt ');
                        view.setUint32(16, 16, true);
                        view.setUint16(20, 1, true);
                        view.setUint16(22, 1, true);
                        view.setUint32(24, sampleRate, true);
                        view.setUint32(28, sampleRate * 2, true);
                        view.setUint16(32, 2, true);
                        view.setUint16(34, 16, true);
                        writeString(36, 'data');
                        view.setUint32(40, len, true);
                        
                        const pcmData = new Int16Array(wavBuffer, 44);
                        for (let i = 0; i < len / 2; i++) {
                            pcmData[i] = bytes[i*2] | (bytes[i*2+1] << 8);
                        }
                        
                        const blob = new Blob([wavBuffer], { type: 'audio/wav' });
                        setAudioUrl(URL.createObjectURL(blob));
                    }
                } catch (e) {
                    setError("Error al generar el audio.");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-10 max-w-5xl mx-auto">
                    <div className="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200">
                        {/* Cabecera */}
                        <div className="bg-slate-900 p-8 text-white flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter flex items-center gap-2">
                                    <i data-lucide="mic-2" className="text-blue-500 w-6 h-6"></i> DAVID STUDIO <span className="text-blue-500 font-light">PRO</span>
                                </h1>
                                <div className="flex gap-2 mt-2">
                                    <span className="text-[9px] bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30 font-bold tracking-widest uppercase">Gemini 2.5</span>
                                    <span className="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700 font-bold tracking-widest uppercase">Safari OK</span>
                                </div>
                            </div>
                            <div className="flex bg-slate-800 p-1 rounded-xl">
                                <button onClick={() => setLanguage('es')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${language === 'es' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>ES</button>
                                <button onClick={() => setLanguage('en')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${language === 'en' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>EN</button>
                            </div>
                        </div>

                        <div className="p-6 md:p-10 space-y-6">
                            {/* Herramientas IA */}
                            <div className="grid grid-cols-3 gap-3">
                                <button onClick={() => callGeminiAI('polish')} disabled={isAiProcessing} className="py-3 bg-amber-50 text-amber-700 border border-amber-200 rounded-2xl text-[10px] font-black uppercase tracking-tighter active:scale-95 transition-all">✨ Pulir</button>
                                <button onClick={() => callGeminiAI('translate')} disabled={isAiProcessing} className="py-3 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-2xl text-[10px] font-black uppercase tracking-tighter active:scale-95 transition-all">✨ Traducir</button>
                                <button onClick={() => callGeminiAI('summarize')} disabled={isAiProcessing} className="py-3 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-2xl text-[10px] font-black uppercase tracking-tighter active:scale-95 transition-all">✨ Resumir</button>
                            </div>

                            {/* Editor de Texto */}
                            <div className="relative">
                                <textarea 
                                    value={text} 
                                    onChange={(e) => setText(e.target.value)}
                                    className="w-full h-72 p-6 bg-slate-50 rounded-[2rem] border-2 border-slate-100 focus:border-blue-500 outline-none text-slate-800 text-lg leading-relaxed transition-all shadow-inner"
                                    placeholder="Escribe tu guion aquí..."
                                />
                                {isAiProcessing && (
                                    <div className="absolute inset-0 bg-white/60 backdrop-blur-sm flex items-center justify-center rounded-[2rem]">
                                        <div className="loading-spinner"></div>
                                    </div>
                                )}
                            </div>

                            {/* Selectores */}
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase px-2 tracking-widest">Velocidad</label>
                                    <select value={speed} onChange={e => setSpeed(e.target.value)} className="w-full p-4 bg-slate-100 rounded-2xl text-sm font-bold border-none outline-none">
                                        <option value="slow">Lento</option>
                                        <option value="normal">Normal</option>
                                        <option value="fast">Rápido</option>
                                    </select>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase px-2 tracking-widest">Voz</label>
                                    <select value={selectedVoice} onChange={e => setSelectedVoice(e.target.value)} className="w-full p-4 bg-slate-100 rounded-2xl text-sm font-bold border-none outline-none">
                                        <option value="Fenrir">David (Grave)</option>
                                        <option value="Charon">Charon (Deep)</option>
                                        <option value="Kore">Kore (Clear)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Botón Principal */}
                            <button 
                                onClick={produceAudio} 
                                disabled={isGenerating || isAiProcessing}
                                className={`w-full py-6 rounded-[2rem] font-black text-white uppercase tracking-[0.2em] text-sm shadow-2xl transition-all active:scale-[0.98] ${isGenerating ? 'bg-slate-400' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-200'}`}
                            >
                                {isGenerating ? "PROCESANDO..." : "PRODUCIR AUDIO"}
                            </button>

                            {error && <div className="p-4 bg-red-50 text-red-600 rounded-2xl text-center font-bold text-[10px] uppercase border border-red-100">{error}</div>}

                            {/* Resultado Audio */}
                            {audioUrl && !isGenerating && (
                                <div className="p-8 bg-slate-900 rounded-[2rem] space-y-4 animate-in fade-in slide-in-from-bottom-4 border border-slate-700 shadow-2xl">
                                    <div className="flex justify-between items-center px-2">
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                                            <span className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Master WAV Listo</span>
                                        </div>
                                        <a href={audioUrl} download="locucion_david_ia.wav" className="text-[10px] font-black text-white hover:text-blue-400 transition-colors uppercase underline">Descargar</a>
                                    </div>
                                    <audio controls src={audioUrl} className="w-full filter invert hue-rotate-180 contrast-125 brightness-110" autoPlay />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
